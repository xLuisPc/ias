# Solo se necesita para el punto opcional de RabbitMQ.
# UI de administracion: http://localhost:15672 (guest / guest)
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: bancoias-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
